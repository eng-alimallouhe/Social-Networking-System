<form class="register-form" action="#" method="POST">
    <h2>{{ 'Identity.Registeration.Title' | translate }}</h2>
    <div class="form-group">
        <label for="phoneNumber">{{ 'Identity.Registeration.Phone_Number' | translate }}</label>
        <div class="input-wrapper">
            <input type="text" id="phoneNumber" name="phoneNumber" placeholder="{{ 'Identity.Registeration.Phone_Number_Placeholder' | translate }}" required />
            <span class="material-symbols-outlined fluent-icon">mail</span>
        </div>
    </div>
    <div class="form-group">
        <label for="password">{{ 'Identity.Registeration.Password' | translate }}</label>
        <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="{{ 'Identity.Registeration.Password_Placeholder' | translate }}" required />
            <span class="material-symbols-outlined fluent-icon">lock</span>
        </div>
    </div>
    <div class="form-group">
        <label for="password">{{ 'Identity.Registeration.Confirm_Password' | translate }}</label>
        <div class="input-wrapper">
            <input type="password" id="confirm-password" name="confirm-password" placeholder="{{ 'Identity.Registeration.Confirm_Password_Placeholder' | translate }}"
                required />
            <span class="material-symbols-outlined fluent-icon">lock</span>
        </div>
    </div>

    <div class="form-options">
        <label class="terms-label">
            <input type="checkbox" required>
            <span class="checkmark"></span>
            <span>{{ 'Identity.Registeration.Agree' | translate }} <a href="#">{{ 'Identity.Registeration.Terms' | translate }}</a> {{ 'Identity.Registeration.And' | translate }} <a href="#">{{ 'Identity.Registeration.Privacy_Policy' | translate }}</a></span>
        </label>
    </div>
    <button type="submit" class="submit-btn" id="registerBtn">
        <span>{{ 'Identity.Registeration.Register' | translate }}</span>
        <span class="material-symbols-outlined">rocket_launch</span>
    </button>

    <div class="divider">
        <span class="divider-text">{{ 'Identity.Registeration.Divider' | translate }}</span>
    </div>

    <div class="social-login">
        <button type="button" class="social-btn google">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" alt="Google">
        </button>
        <button type="button" class="social-btn github">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
        </button>
        <button type="button" class="social-btn facebook">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </button>
    </div>
    <div class="form-footer">
        <div class="login-prompt">
            <span>{{ 'Identity.Registeration.Login_Prompt' | translate }} </span>
            <a [routerLink]="['/auth/login']" class="login-link">{{ 'Identity.Registeration.Login_Link' | translate }}</a>
        </div>
    </div>
</form>
