<form class="activate-form" (submit)="$event.preventDefault()">
    <h2>{{ 'Identity.Registeration.Activate_Account.Title' | translate }}</h2>
    <p class="description">{{ 'Identity.Registeration.Activate_Account.Subtitle' | translate }}</p>

    <div class="otp-container">
        @for (field of otpFields; track $index) {
        <input #otpInput type="text" maxlength="1" class="otp-input" inputmode="numeric" autocomplete="one-time-code"
            (input)="onInput($event, $index)" (keydown)="onKeyDown($event, $index)" (focus)="onFocus($event)"
            (paste)="$index === 0 ? onPaste($event) : null" />
        }
    </div>

    <div class="resend-container">
        <span>{{ 'Identity.Registeration.Activate_Account.Resend_Code' | translate }} </span>
        <button type="button" class="resend-btn">{{ 'Identity.Registeration.Activate_Account.Resend_Code' | translate }}</button>
    </div>

    <button type="submit" class="submit-btn">
        <span>{{ 'Identity.Registeration.Activate_Account.Submit' | translate }}</span>
        <span class="material-symbols-outlined">verified_user</span>
    </button>
</form>
