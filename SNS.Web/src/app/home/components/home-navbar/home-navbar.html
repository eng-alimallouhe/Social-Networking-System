<nav class="home-navbar" [class.is-mobile]="isMobile()">
    <!-- LEFT SIDE -->
    <div class="nav-left">
        @if (isMobile()) {
        <button type="button" class="btn btn-icon btn-ghost mobile-menu-btn icon-btn" (click)="toggleSideMenu()" aria-label="Open menu">
            <svg lucideMenu></svg>
        </button>
        }
        <a routerLink="/" class="brand-area">
            <div class="logo">
                <img src="../../../../assets/icons/github.svg" alt="Logo">
            </div>
            <h2 class="site-name">{{ 'App.Site_Name' | translate }}</h2>
        </a>
    </div>

    <!-- CENTER (Desktop only) -->
    @if (!isMobile()) {
    <div class="nav-center">
        <a [routerLink]="['/home']" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active"
            class="nav-link">
            <svg lucideHome></svg>
        </a>
        <a routerLink="/home/search" routerLinkActive="active" class="nav-link">
            <svg lucideSearch></svg>
        </a>
        <a routerLink="/home/discussion" routerLinkActive="active" class="nav-link">
            <svg lucideMessagesSquare></svg>
        </a>
        <a routerLink="/home/projects" routerLinkActive="active" class="nav-link">
            <svg lucideFolderClosed></svg>
        </a>
    </div>
    }

    <!-- RIGHT SIDE -->
    <div class="nav-right">
        <button type="button" class="btn btn-icon btn-primary" aria-label="Create Content"
            cdkOverlayOrigin #createOrigin="cdkOverlayOrigin"
            (click)="isCreateMenuOpen.set(!isCreateMenuOpen())">
            <svg lucideSquarePlus></svg>
        </button>

        <!-- Create Content Dropdown Overlay -->
        <ng-template cdkConnectedOverlay 
            [cdkConnectedOverlayOrigin]="createOrigin"
            [cdkConnectedOverlayOpen]="isCreateMenuOpen()" 
            [cdkConnectedOverlayPositions]="createMenuPositions()"
            [cdkConnectedOverlayHasBackdrop]="true" 
            cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
            (backdropClick)="isCreateMenuOpen.set(false)">
            <div class="actions-menu-dropdown create-menu-dropdown">
                <div class="menu-group">
                    <button type="button" class="btn btn-ghost menu-item" (click)="navigateTo('/home/create-post')">
                        <svg lucideFileText></svg>
                        <span>{{ 'ContentCreation.Dropdown.Create_Post' | translate }}</span>
                    </button>
                    <button type="button" class="btn btn-ghost menu-item" (click)="navigateTo('/home/create-problem')">
                        <svg lucideHelpCircle></svg>
                        <span>{{ 'ContentCreation.Dropdown.Create_Problem' | translate }}</span>
                    </button>
                    <button type="button" class="btn btn-ghost menu-item" (click)="navigateTo('/home/create-project')">
                        <svg lucideFolderPlus></svg>
                        <span>{{ 'ContentCreation.Dropdown.Create_Project' | translate }}</span>
                    </button>
                </div>
            </div>
        </ng-template>

        <button type="button" class="btn btn-icon btn-ghost notify-btn icon-btn" aria-label="Notifications">
            <svg lucideBell></svg>
        </button>
    </div>
</nav>
