<article class="community-card">
    <div class="community-card-body">
        <!-- Square Logo -->
        <div class="community-logo-box">
            @if (community().logoUrl) {
                <img [src]="community().logoUrl" [alt]="community().name" class="community-logo-img" />
            } @else {
                <div class="community-logo-fallback">{{ initials() }}</div>
            }
        </div>

        <!-- Info Column -->
        <div class="community-info">
            <h3 class="community-name" [title]="community().name">{{ community().name }}</h3>
            @if (community().description) {
                <p class="community-description" [title]="community().description">{{ community().description }}</p>
            }
            <div class="community-meta">
                <span class="members-count">
                    {{ community().membersCount | number }} {{ 'Community.Members' | translate }}
                </span>
            </div>
        </div>
    </div>

    <!-- Full-width View Community Button -->
    <a [routerLink]="['/communities', community().id]" class="btn btn-outlined btn-block" (click)="onCommunityClick($event)">
        {{ 'Community.View_Community' | translate }}
    </a>
</article>
