<div [class]="containerClasses()">
    @if (hasValidImage()) {
        <img
            [src]="src()!"
            [alt]="alt() || name() || ''"
            (error)="onImageError()"
            class="avatar-img" />
    } @else {
        <div
            class="avatar-fallback"
            [attr.aria-label]="alt() || name() || ''"
            role="img">
            @if (initials()) {
                {{ initials() }}
            } @else {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fallback-icon" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            }
        </div>
    }
</div>
