<div class="verify-authenticator-wrapper">
    <div class="title-section">
        <h1>{{ 'Identity.Security_Settings.Security_Settings_Page.Authenticator.Title' | translate }}</h1>
    </div>

    <form [formGroup]="otpForm" class="verify-authenticator-form" autocomplete="off" (ngSubmit)="onSubmit()">
        <h2>{{ 'Identity.Security_Settings.Security_Settings_Page.Authenticator.Subtitle' | translate }}</h2>

        <div class="form-group code-group">
            <label class="code-title-label">{{ 'Identity.Security_Settings.Security_Settings_Page.Authenticator.Enter_Code' | translate }}</label>
            <app-code-input formControlName="code" [length]="6"></app-code-input>
            <div *ngIf="otpForm.invalid && (otpForm.touched || otpForm.dirty)" class="error-message">
                <span>{{ 'Shared.Errors.Invalid_Code' | translate }}</span>
            </div>
        </div>

        <div class="buttons-group">
            <button type="button" class="btn btn-secondary" [routerLink]="['/account-settings/security-settings/link-authenticator']">
                {{ 'Shared.Actions.Back' | translate }}
            </button>
            <button type="submit" [disabled]="otpForm.invalid" class="btn btn-primary" id="verifyAuthBtn">
                <span>{{ 'Identity.Security_Settings.Security_Settings_Page.Actions.Verify' | translate }}</span>
                <svg lucideCheckLine></svg>
            </button>
        </div>
    </form>
</div>
